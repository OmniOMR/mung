[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.hatch.build.targets.wheel]
packages = ["mung"]

[project]
name = "mung"
dependencies = [
    "numpy",
    "lxml",
    "pytest",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
    "MIDIUtil",
    "midi2audio"
]
description = "Object Detection Tools"
readme = "README.md"
requires-python = ">=3.11"
version = "1.0.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
